# Widget12 site configuration (El Niño story, Next.js with basePath /widget12)
# Prefix match without a trailing slash: Next.js serves the page at /widget12
# (and redirects /widget12/ there), so both must reach the app.
location /widget12 {
    # Resolve the container through Docker's DNS per request (not once at
    # startup), so nginx still starts when plugin-widget12 is down, and follows
    # the container to its new IP after a rebuild.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $widget12_upstream http://plugin-widget12:3000;

    # No rewrite: the Next.js app expects the /widget12 prefix (basePath).
    proxy_pass $widget12_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_intercept_errors off;
    proxy_redirect off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
