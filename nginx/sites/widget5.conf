# Widget5 site configuration
location /cok/ {
    # Resolve at request time, not at startup: with a literal hostname in proxy_pass,
    # nginx refuses to start (taking every site down) if the name can't be resolved
    # when it loads. With a variable, only /cok/ requests fail in that case.
    resolver 127.0.0.11 valid=300s ipv6=off;  # Docker's embedded DNS (compose network)
    resolver_timeout 10s;
    set $cok_upstream https://ocean-zarr.spc.int;
    proxy_pass $cok_upstream;
    proxy_ssl_server_name on;
    proxy_set_header Host ocean-zarr.spc.int;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location /widget5/ {
    rewrite ^/widget5/(.*)$ /$1 break;
    proxy_pass http://plugin-widget5:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_intercept_errors off;
    proxy_redirect off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Handle static assets for widget5
location /widget5/static/ {
    proxy_pass http://plugin-widget5:80/static/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary Accept-Encoding;
}
